# node と pnpm は package.json から Vite+ が解決するので、mise の PATH への注入を止める (ADR-0004)
[settings]
disable_tools = ["node", "pnpm"]

[env]
# config_root から組んで絶対パスにする (docs/guides/database.md「パスを cwd 基準にする理由」)
DB_FILE_NAME = "{{ [config_root, '.data/dev.sqlite'] | join_path }}"

# port は worktree ごとに導出し、[env] ではなくタスクの env に置く (ADR-0004)
[tasks.serve]
description = "dev server を起動する"
env = { DEV_PORT = "{{ exec(command='bash scripts/dev-env/derive-dev-port.sh 3000') }}" }
run = "vp dev --port $DEV_PORT"

[tasks.storybook]
description = "Storybook を起動する"
env = { STORYBOOK_PORT = "{{ exec(command='bash scripts/dev-env/derive-dev-port.sh 6006') }}" }
run = "vp exec storybook dev --port $STORYBOOK_PORT --no-open"

[tasks.contrast]
description = "トークンからコントラスト比を測る"
run = "vp node scripts/contrast/report.ts"

# 読み方は docs/guides/testing/annotations.md「注釈を読む」、tag とフラグは docs/guides/accessibility.md「a11y の tag を付ける」
[tasks."a11y:incomplete"]
description = "axe を回すテストを verbose で走らせ、axe が判定できなかった項目の注釈を読む"
run = "vp test run --project browser --tags-filter axe --reporter=verbose --hide-skipped-tests"

[tasks."db:generate"]
description = "Drizzle スキーマから migration を生成する"
run = "vp exec drizzle-kit generate"

[tasks."db:migrate"]
description = "migration をローカル DB へ適用する"
run = "vp exec drizzle-kit migrate"

[tasks.verify]
description = "マージ前検証をまとめて実行する"
run = [
  # peer の食い違いを数える。lockfile を書き換えない (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
  "pnpm peers check",
  "vp check",
  "vp test run",
  # *.tz.test.ts を TZ ごとに別のプロセスで走らせる (docs/guides/testing/time-zones.md「Node で動くテストを TZ ごとに走らせる」)
  "vp node scripts/time-zones/run-tests.ts",
  "vp build",
  # ビルド成果物を起動して実レスポンスを見るため build のあとに置く
  "vp node scripts/checks/runtime/security-headers.ts",
  # Storybook の静的ビルドが通ることを確かめる (docs/guides/vite-configuration.md「重い依存を遅らせて読み込む」)
  "vp exec storybook build --quiet",
]
