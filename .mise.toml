# node と pnpm の版は package.json (devEngines.runtime / packageManager) が持ち、Vite+ が解決する
# (ADR-0008)。開発者のグローバル mise 設定が node / pnpm を持つと、その PATH が vp の shim を
# 覆って版が食い違う。ここで無効化すると mise は PATH へ注入しなくなる
[settings]
disable_tools = ["node", "pnpm"]

[env]
DB_FILE_NAME = ".data/dev.sqlite"

# port は worktree ごとに分ける。固定すると 2 つ目の worktree が bind に失敗する。
# 導出はタスクの env に置く。要るのはこの 2 つのタスクだけなのに、トップレベルの [env] へ
# 置くと mise が env を解決するたび (シェル hook 下ではディレクトリへ入るたび) に git の
# サブプロセスが走る。run の引数へ $(...) を直接書く形も採らない。script が実行できなかった
# ときに空文字が渡り、Vite の既定 port で起動して worktree の分離が無言で外れる。タスクの
# env なら、そのタスクを叩いたときだけ走り、シェル hook の有無にも依存しない。script が
# 失敗すればタスクごと止まる (2026-09-20 実測)
[tasks.serve]
description = "dev server を起動する"
env = { DEV_PORT = "{{ exec(command='bash scripts/dev-env/derive-dev-port.sh 3000') }}" }
run = "vp dev --port $DEV_PORT"

[tasks.storybook]
description = "Storybook を起動する"
env = { STORYBOOK_PORT = "{{ exec(command='bash scripts/dev-env/derive-dev-port.sh 6006') }}" }
run = "vp exec storybook dev --port $STORYBOOK_PORT --no-open"

[tasks.contrast]
description = "トークンからコントラスト比を測る"
run = "vp node scripts/contrast/report.ts"

[tasks."db:generate"]
description = "Drizzle スキーマから migration を生成する"
run = "vp exec drizzle-kit generate"

[tasks."db:migrate"]
description = "migration をローカル DB へ適用する"
run = "vp exec drizzle-kit migrate"

[tasks.verify]
description = "マージ前検証をまとめて実行する"
run = [
  "vp check",
  "vp test run",
  "vp build",
  # ビルド成果物を起動して実レスポンスを見るため build のあとに置く
  "vp node scripts/checks/runtime/security-headers.ts",
]
