# 下の daemons (自動 port と task =) を確かめた版。これより古い mise は読み込みで止まる (ADR-0004)
min_version = "2026.10.3"

[tools]
# 下の daemons は pitchfork が動かす。宣言が無いと、mise の shim が PATH にあるシェルの mise daemons stop が
# 版の決まらない shim を拾って失敗する (ADR-0004)
pitchfork = "2"

[settings]
# node と pnpm は package.json から Vite+ が解決するので、mise の PATH への注入を止める (ADR-0004)
disable_tools = ["node", "pnpm"]
# daemons (下の port の導出) が experimental (ADR-0004)
experimental = true

[env]
# config_root から組んで絶対パスにする (docs/guides/database.md「パスを cwd 基準にする理由」)
DB_FILE_NAME = "{{ [config_root, '.data/dev.sqlite'] | join_path }}"

# vite.config.ts の同名のタスクは worktree を知らない。worktree ごとの port は、下の daemons が出す
# SERVE_PORT / STORYBOOK_PORT を、このタスクが引数で足す。serve は PORT にも入れる。nitro が --port より
# PORT を先に読むので、シェルに PORT があると別の port で起動する (ADR-0004)
# interactive は stdin を確実につなぎ、Vite のキーボードのショートカットを効かせる。interactive のタスクは
# mise の I/O の lock を取るので、serve と storybook を 1 つの mise run (depends など) で束ねない。一方が
# 待ち続ける。両方を動かすときは daemons を使う (ADR-0004)
[tasks.serve]
interactive = true
run = "PORT=${SERVE_PORT:?mise の daemons の port が届いていない} exec vp run serve --port $SERVE_PORT"

[tasks.storybook]
interactive = true
run = "exec vp run storybook --port ${STORYBOOK_PORT:?mise の daemons の port が届いていない}"

# daemons は上のタスクを走らせる。proxy を使わないので URL の変数を出さない (ADR-0004)
# port は起動前から決まっていて、hook の無いシェルでも mise x -- printenv SERVE_PORT か mise daemons urls で引ける
[daemons.serve]
task = "serve"
port = { auto = true, base = 3000 }
proxy = false

[daemons.storybook]
task = "storybook"
port = { auto = true, base = 6006 }
proxy = false
