# 下の daemons の自動 port を確かめた版。これより古い mise は読み込みで止まる (ADR-0004)
min_version = "2026.9.18"

[settings]
# node と pnpm は package.json から Vite+ が解決するので、mise の PATH への注入を止める (ADR-0004)
disable_tools = ["node", "pnpm"]
# daemons (下の port の導出) が experimental (ADR-0004)
experimental = true

[env]
# config_root から組んで絶対パスにする (docs/guides/database.md「パスを cwd 基準にする理由」)
DB_FILE_NAME = "{{ [config_root, '.data/dev.sqlite'] | join_path }}"

# 自動 port を SERVE_PORT / STORYBOOK_PORT として出す。vite.config.ts の同名のタスクがこの値を読み、
# mise の環境を読んだシェルからは vp run で前面でも動く。proxy を使わないので URL の変数を出さない (ADR-0004)
[daemons.serve]
run = "exec vp run serve"
port = { auto = true, base = 3000 }
proxy = false

[daemons.storybook]
run = "exec vp run storybook"
port = { auto = true, base = 6006 }
proxy = false
