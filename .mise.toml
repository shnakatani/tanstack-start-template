# 下の daemons の自動 port を確かめた版。これより古い mise は読み込みで止まる (ADR-0004)
min_version = "2026.9.18"

[settings]
# node と pnpm は package.json から Vite+ が解決するので、mise の PATH への注入を止める (ADR-0004)
disable_tools = ["node", "pnpm"]
# daemons (下の port の導出) が experimental (ADR-0004)
experimental = true

[env]
# config_root から組んで絶対パスにする (docs/guides/database.md「パスを cwd 基準にする理由」)
DB_FILE_NAME = "{{ [config_root, '.data/dev.sqlite'] | join_path }}"

# port は下の daemons が worktree ごとに導出する (ADR-0004)
[tasks.serve]
description = "dev server を起動する"
run = "vp dev --port $SERVE_PORT --strictPort"

[tasks.storybook]
description = "Storybook を起動する"
run = "vp exec storybook dev --port $STORYBOOK_PORT --no-open --exact-port"

[tasks."db:generate"]
description = "Drizzle スキーマから migration を生成する"
run = "vp exec drizzle-kit generate"

[tasks."db:migrate"]
description = "migration をローカル DB へ適用する"
run = "vp exec drizzle-kit migrate"

# 手順は docs/guides/database.md「見本のデータを入れる」
[tasks."db:seed"]
description = "migration を当ててから、ローカル DB の行を消して見本のデータを入れ直す"
depends = ["db:migrate"]
run = "vp exec tsx scripts/db/seed.ts"

# 自動 port を SERVE_PORT / STORYBOOK_PORT として出す。タスクは mise run で前面でも動く。
# proxy を使わないので URL の変数を出さない (ADR-0004)
[daemons.serve]
task = "serve"
port = { auto = true, base = 3000 }
proxy = false

[daemons.storybook]
task = "storybook"
port = { auto = true, base = 6006 }
proxy = false
