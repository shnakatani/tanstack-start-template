name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定の GITHUB_TOKEN 権限を絞る。どの job も checkout しか要らない
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # browser mode は無言でハングしうる。既定の 6 時間を待たずに切る
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # credential を残さない (ADR-0006)
          persist-credentials: false

      # Node.js・pnpm・依存キャッシュを用意し、vp install まで走らせる (run-install の既定が true)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          # 依存キャッシュを保存するのは main への push だけ。PR の run が保存したキャッシュはほかから使えない (ADR-0004)
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - run: vp run verify:peers

      # chromium は vp install では入らない (playwright が install スクリプトを持たない)
      - run: vp exec playwright install chromium --only-shell

      # PR の差分に lint の注釈は出ない (voidzero-dev/vite-plus#925、docs/guides/lint/configuration.md「PR の差分に lint の注釈を出す」)
      - run: vp run verify:check
      - run: vp run verify:test
        id: test
      # 失敗した job を再実行すると、前の試行の artifact は取れなくなる (actions/upload-artifact#585)。再実行の前に開く
      - if: failure() && steps.test.conclusion == 'failure'
        id: upload-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: .vitest/index.html
          # zip にせず上げると、GitHub がブラウザでそのまま開く (GitHub Changelog 2026-02-26)
          archive: false
      # report が書かれる前に落ちると、upload は警告だけ出して成功し、artifact-url を持たない
      - if: failure() && steps.upload-report.outputs.artifact-url != ''
        run: echo "::notice title=Vitest HTML report::$REPORT_URL"
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
      - run: vp run verify:time-zones
      - run: vp run verify:build
      - run: vp run verify:security-headers
