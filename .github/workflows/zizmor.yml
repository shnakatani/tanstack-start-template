name: zizmor

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SARIF を上げないので security-events: write は要らない (ADR-0006)
permissions: {}

jobs:
  zizmor:
    # 1 分かからない軽い job なので、1 vCPU の runner で走らせる。slim の job の上限は 15 分で、Docker-in-Docker のような特権の要る操作はできない (ADR-0006)
    runs-on: ubuntu-slim
    # private リポジトリの checkout に要る (ADR-0006)
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # 指摘があれば job を落とす。本体の版は action が固定し、設定は .github/zizmor.yml が持つ (ADR-0006)
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
