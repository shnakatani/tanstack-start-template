name: zizmor

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SARIF を上げないので security-events: write は要らない (ADR-0006)
permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    # private リポジトリの checkout に要る (ADR-0006)
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 指摘があれば job を落とす。本体の版は action が固定し、設定は .github/zizmor.yml が持つ (ADR-0006)
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
