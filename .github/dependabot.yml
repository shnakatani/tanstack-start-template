version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # pnpm-workspace.yaml の minimumReleaseAge (4320 分 = 3 日) と揃えた明示設定。変更時は両方と
    # .github/zizmor.yml の下限を更新する。
    # GitHub デフォルト (3 日) と同値だが、ポリシーの対をここに固定する。security updates は cooldown 対象外。
    # Vite+ 管理下のパッケージは pnpm 側だけ待機を外している (ADR-0005)。bot 側は vite-plus にも 3 日を掛ける
    cooldown:
      default-days: 3
    ignore:
      # @types/node は Node runtime (package.json の devEngines.runtime) と major を揃える。
      # runtime を上げるときに一緒に上げる (minor / patch は通常どおり更新する)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Vite+ が版を決める一族は bot に上げさせない。vite-plus の PR のブランチで vp migrate を打ち、
      # core (vite の alias 先)・vitest・@vitest/* を同梱の版へ揃える (ADR-0005 の決定 5)。
      # bot は vitest を vite-plus と別に上げ、同梱の版より先へ進める (voidzero-dev/vite-plus#2356)。
      # ignore は security updates の PR も止める。脆弱性は alerts で知り、vite-plus を上げて直す
      - dependency-name: "vite"
      - dependency-name: "@voidzero-dev/*"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
    groups:
      # vite-plus を他の依存と混ぜず 1 本の PR にする。PR は新しい版の通知として使い、
      # そのブランチで vp migrate を打って仕上げる。major も含めるため minor-and-patch より前に置く
      # (Dependabot は先に一致したグループを採る)
      vite-plus:
        patterns:
          - "vite-plus"
      # @vitejs/plugin-react は optional peer の oxc-transform-react を呼び出す。
      # 別々の PR に割れると、上流がテストしていない組み合わせが片方ずつマージされる。
      # peer 範囲は緩和してあるため (pnpm-workspace.yaml)、不整合を install が止めない
      react-compiler:
        patterns:
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
