version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # pnpm-workspace.yaml の minimumReleaseAge (4320 分 = 3 日) と揃えた明示設定。変更時は両方と
    # .github/zizmor.yml の下限を更新する。
    # GitHub デフォルト (3 日) と同値だが、ポリシーの対をここに固定する。security updates は cooldown 対象外。
    # Vite+ 管理下のパッケージは pnpm 側だけ待機を外している (ADR-0005)。bot 側は 3 日を維持し、
    # グループ内の全メンバーが同じ日に eligible になる状態を保つ
    cooldown:
      default-days: 3
    ignore:
      # @types/node は Node runtime (package.json の devEngines.runtime) と major を揃える。
      # runtime を上げるときに一緒に上げる (minor / patch は通常どおり更新する)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest と @vitest/* の版は vite-plus の同梱の版で決まり、vite-plus の PR で vp migrate が揃える
      # (ADR-0005)。bot に上げさせると、vitest が vite-plus より先に出た週ごとに同梱の版より先へ進む PR が
      # 作られ、閉じても次の実行で作り直される (グループの PR は閉じても版を ignore しない)。
      # vite-plus グループの patterns には残す (実測した構成を保ち、minor-and-patch の exclude-patterns と対にする)。
      # 撤去条件: Vite+ の docs が bot の設定例で vitest を上げさせる形を示し、単独で先へ進む vitest の PR を
      # 扱う手順を持ったとき (voidzero-dev/vite-plus#2356)。vite-plus の PR が来なくなったら外して見直す
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@vitest/*"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
    groups:
      # vite-plus と、その同梱の版で決まる core・vitest・@vitest/* を 1 本の PR に束ねる (ADR-0005)。
      # どの PR も、そのブランチで vp migrate を打って同梱の版へ揃えてから取り込む
      # (docs/guides/dependencies-and-toolchain.md「Vite+ を上げる」)。vitest と @vitest/* は上の ignore で
      # bot には上げさせない。
      # vite はワイルドカード無しの完全一致なので vite-plus のパターンでは拾えない
      vite-plus:
        patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
          - "vitest"
          - "@vitest/*"
      # @vitejs/plugin-react は optional peer の oxc-transform-react を呼び出す。
      # 別々の PR に割れると、上流がテストしていない組み合わせが片方ずつマージされる。
      # peer 範囲は緩和してあるため (pnpm-workspace.yaml)、不整合を install が止めない
      react-compiler:
        patterns:
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
      # 上の 2 グループの patterns を exclude-patterns に写す。patterns を持たないグループは、
      # 他のグループに入った依存も抱え込む (docs の「最初に一致したグループに入る」と挙動が食い違う。
      # dependabot/dependabot-core#14576)。2026-09-28 には vitest が vite-plus と minor-and-patch の
      # 両方の PR に載った。上のグループの patterns を変えたらここも変える
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
