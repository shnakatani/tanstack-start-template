version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # pnpm-workspace.yaml の minimumReleaseAge と .github/zizmor.yml の下限と対で持つ (ADR-0005)
    cooldown:
      default-days: 3
    ignore:
      # @types/node の major は Node の runtime (package.json の devEngines.runtime) と揃え、runtime と一緒に上げる。
      # minor を上げたら package.json の engines.node の下限もその minor まで上げる (ADR-0004)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest と @vitest/* は vite-plus の同梱の版で決まるので bot に上げさせない (ADR-0005)
      # 撤去条件: Vite+ の docs が、単独で先へ進む vitest の PR を作らせない bot の設定例を示したとき (voidzero-dev/vite-plus#2356)
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
    groups:
      # vite-plus と core を 1 本の PR に束ねる。PR の扱いは docs/guides/dependencies-and-toolchain.md「Vite+ を上げる」 (ADR-0005)
      vite-plus:
        patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
          - "vitest"
          - "@vitest/*"
      # plugin-react と、それが呼ぶ optional peer を 1 本の PR にする (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
      react-compiler:
        patterns:
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
      # 上の 2 グループの patterns を写し、変えたらここも変える (dependabot/dependabot-core#14576。
      # docs/guides/dependencies-and-toolchain.md「Vite+ を上げる」)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
