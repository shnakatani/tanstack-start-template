# ===== Vite+ が管理 (vp migrate が書く。手で編集しない) =====

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
  "@vitest/browser-playwright": 5.1.0
  "@vitest/coverage-v8": 5.1.0
  "@vitest/ui": 5.1.0

# ===== 両方が書く (1 つのキーに vp migrate の行と手で足す行が同居する) =====

# vite@* / vitest@* は vp migrate が書く。vp pm audit --fix が足す行には撤去条件を書く (ADR-0005)
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # drizzle-kit が宣言だけして import しない依存を外す。持ち込む esbuild@0.18.20 が GHSA-67mh-4wv8-2f99 に当たる (drizzle-team/drizzle-orm#5481)
  # 撤去条件: drizzle-kit の安定版が @esbuild-kit/esm-loader を依存から外したとき
  "drizzle-kit>@esbuild-kit/esm-loader": "-"

# 待機の除外 (ADR-0005)。版の無い行は vp migrate が書く恒久除外で、編集しない。
# 手で足す行と vp pm audit --fix が足す行は版まで書く (@scope/pkg@x.y.z)
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - tsrs
  - "@tsrs/*"

# vitest の行は vp migrate が書き、消しても書き戻す。vite の行は vp migrate が消す (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
    # --- ここから下はこのテンプレートが追加 ---
    # storybook@10.6.7 の optional peer (vite-plus ^0.1.15 || ^0.2.0) が 1.0 に追いついていない。読むのは 1.0 も
    # export する vite-plus/versions だけ (2026-11-23 に storybook@10.6.7 の dist と vite-plus 1.7.0 の exports で確認)。撤去条件: storybook の peer が vite-plus 1.x を含んだとき
    # 値が major なので export が消えても鳴らない。上げたときの確認は docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」
    "storybook@10>vite-plus": "1"
    # @vitejs/plugin-react@6.3.0 の optional peer (oxc-transform-react >=0.152.0 <0.157.0) が 0.157.0 以降を受けない。
    # 0.157.0 から React Compiler の誤変換の修正 (oxc-project/oxc#28195) が入る。nullable な state のメンバーを閉包で読むと
    # cache guard が初回の描画で throw するものを含む。このリポジトリは React Compiler を有効にしているので (ADR-0014)、peer が広がるのを待たずに入れる
    # 撤去条件: plugin-react の peer が oxc-transform-react 0.158 を含んだとき
    "@vitejs/plugin-react@6>oxc-transform-react": "^0.158.0"

# ===== このテンプレートが追加 (vp migrate が書かない) =====

# pnpm と Node.js の版は Vite+ が packageManager と devEngines.runtime から選ぶ。pnpm に切り替えさせず、Node.js を扱わせない (ADR-0004)
# vp add・vp remove・引数なしの vp update は runtimeOnFail の値を devEngines.runtime の onFail に書き足す。commit の前に消す (ADR-0004)
pmOnFail: ignore
runtimeOnFail: ignore

# vp add が、型を同梱しない依存の @types/* を devDependencies に足す (docs/guides/dependencies-and-toolchain.md「依存を足す・外す」)
saveTypes: true

# 依存が同梱する agent skill を pnpm に link させない。TanStack の skill は AGENTS.md の Intent で読む (docs/guides/dependencies-and-toolchain.md「依存が同梱する agent skill」)
skills:
  dirs: []

allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true

# 公開後 3 日 (4320 分) 未満の版を解決しない。.github/dependabot.yml の cooldown と
# .github/zizmor.yml の下限を同じ値に揃える (ADR-0005)
minimumReleaseAge: 4320

# lockfile が解決しなくなった除外を vp add / update / remove が消す (docs/guides/dependencies-and-toolchain.md「待機を前倒しする」)
minimumReleaseAgeExcludePrune: true

# @shadcn/lint が引く @typescript-eslint/parser は、oxlint 経由では読まれないのに eslint を必須 peer に持つ。optional にする (ADR-0023)
# utils には当てない。実行時に eslint を読む (docs/guides/lint/configuration.md「testing-library を story に限る理由」)
# 撤去条件: 上流が parser の eslint を optional peer にしたとき (shadcn-ui/lint#1)
packageExtensions:
  "@typescript-eslint/parser@^8":
    peerDependenciesMeta:
      eslint:
        optional: true
