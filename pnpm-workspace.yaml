overrides:
  # vite-plus と core (vite の alias) を同じリリースに揃える。版は catalog が持つ。
  # キーを範囲つき (@*) にする。範囲なしだと catalog: 参照まで置き換わり、package.json に解決済みの
  # alias が書き戻る (voidzero-dev/vite-plus#2309)
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true

# 公開後 3 日 (4320 分) 未満の版を解決しない。.github/dependabot.yml の cooldown と
# .github/zizmor.yml の下限を同じ値に揃える (ADR-0005)
minimumReleaseAge: 4320

# lockfile が解決しなくなった除外を vp add / update / remove が自動で消す。
# 下の bare name (vite-plus など) も対象なので、Vite+ がそれを解決しなくなると恒久除外も消える
minimumReleaseAgeExcludePrune: true

# 待機の除外 (ADR-0005)
# - 下の一覧は vp migrate が書く Vite+ 一族の恒久除外。編集しない
# - 足すときは必ず版まで書く (`@scope/pkg@x.y.z`)。版を省くと全版が恒久に除外される
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
# vite-plus と core は同じリリースで揃えて上げる (voidzero-dev/vite-plus#2356)。
# dependabot.yml の vite-plus グループが束ねる
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  "@vitest/browser-playwright": 5.0.1
  "@vitest/coverage-v8": 5.0.1
# @shadcn/lint が依存に持つ @typescript-eslint/parser は、oxlint 経由では読まれないのに eslint を必須 peer に持つ。
# optional にして、parser だけが理由で ESLint 一式が入らないようにする。
# いま ESLint が入るのは、eslint-plugin-testing-library と @tanstack/eslint-plugin-* が @typescript-eslint/utils
# 経由で必須にしているため (`vp why eslint`)。それらが外れれば ESLint も外れる。
# utils 側には当てない。utils は実行時に eslint を読むので、外すと plugin が落ちる (docs/guides/lint/configuration.md)。
# このキーはグラフ全体の parser に効く。ESLint を実際に使う依存を足すときは、その peer が外れていないかを確かめる。
# 撤去条件: 上流が parser の eslint を optional peer にしたとき (shadcn-ui/lint#1)
packageExtensions:
  "@typescript-eslint/parser@^8":
    peerDependenciesMeta:
      eslint:
        optional: true

# vite を core へ alias すると版が core の番号 (1.x) になり、vite の peer 範囲を満たさなくなる。
# vp migrate が書く、番号の不一致だけを抑える設定。外しても vp migrate が書き戻す。
# vitest の行は何も抑えていない。上の overrides の vitest@* が peer の宣言も catalog の版 (5.0.1) へ
# 置き換えるので、vitest の peer は食い違いとして出ない (pnpm の docs の dependency-resolution
# 「Overriding peer dependencies」)。vite の行は効いている。vite@* の catalog の値は npm: の alias で、
# vite の peer の宣言は置き換わらず、外すと pnpm peers check が vite の食い違いを報告する (2026-09-28 に実測。
# alias の扱いは docs に無い)。
# 食い違いは pnpm peers check で数える (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @vitejs/plugin-react の optional peer (oxc-transform-react ^0.145.0) が、上流自身の使う ^0.147.0 を
    # 満たさない (ADR-0014)。plugin-react を上げるたびに両者を読み比べる。
    # 親つきのキーで plugin-react の下だけに効かせ、値は検証した版に絞る (* にすると読み比べの契機が消える)
    "@vitejs/plugin-react>oxc-transform-react": "^0.147.0"
    # @storybook/addon-vitest@10.6.0 の optional peer は @vitest/browser-playwright ^4 で、Vitest 5 に
    # 追いついていない。撤去条件: addon-vitest の peer が @vitest/browser-playwright 5 を含んだとき
    "@storybook/addon-vitest>@vitest/browser-playwright": "5.0.1"
    # storybook@10.6.0 の optional peer は vite-plus ^0.1.15 || ^0.2.0 で、1.0 に追いついていない。
    # storybook が読むのは vite-plus/versions (vitest と vite の版の検出) だけで、1.0 も export している
    # (storybook@10.6.0 の dist で確認)。キーに親の版を付けても pnpm peers check は親の版を見ないので、
    # storybook を上げたら dist の vite-plus の import を読み直す。
    # 撤去条件: storybook の peer が vite-plus 1.x を含んだとき
    "storybook>vite-plus": "1.0.0"

# @storybook/addon-vitest@10.6.0 は story の viewport を `import("@vitest/browser/context")` の page で当てる。
# Vitest 5 ではこの import が throw し、addon が catch して何も言わずに return するので、全 story が
# Vitest 既定の 414x896 で走り、parameters / globals の viewport も効かない。patch は import 先を上流の
# next と同じ `vitest/browser` へ替える (storybookjs/storybook#36164)。
# キーを版まで固定する。addon を上げると patch が当たらず install が落ち (allowUnusedPatches の既定は false)、
# 出口条件を確かめる契機になる (ADR-0005)。
# 撤去条件: addon-vitest の安定版が peer に vitest 5 を含み、viewport の import を vitest/browser にしたとき
patchedDependencies:
  "@storybook/addon-vitest@10.6.0": patches/@storybook__addon-vitest@10.6.0.patch
