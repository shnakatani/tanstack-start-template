# ===== Vite+ が管理 (vp migrate が書く。手で編集しない) =====

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  "@vitest/browser-playwright": 5.0.1
  "@vitest/coverage-v8": 5.0.1

# ===== 両方が書く (1 つのキーに vp migrate の行と手で足す行が同居する) =====

# vite@* / vitest@* は vp migrate が書く。vp pm audit --fix が足す行には撤去条件を書く (ADR-0005)
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # drizzle-kit が宣言だけして import しない依存を外す。持ち込む esbuild@0.18.20 が GHSA-67mh-4wv8-2f99 に当たる (drizzle-team/drizzle-orm#5481)
  # 撤去条件: drizzle-kit の安定版が @esbuild-kit/esm-loader を依存から外したとき
  "drizzle-kit>@esbuild-kit/esm-loader": "-"

# 待機の除外 (ADR-0005)。版の無い行は vp migrate が書く恒久除外で、編集しない。
# 手で足す行と vp pm audit --fix が足す行は版まで書く (@scope/pkg@x.y.z)
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"

# vite / vitest の行は vp migrate が書き、消しても書き戻す (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # --- ここから下はこのテンプレートが追加 ---
    # @vitejs/plugin-react の optional peer (oxc-transform-react ^0.145.0) が上流自身の使う ^0.147.0 を満たさない (ADR-0014)
    # 撤去条件: plugin-react の peer の範囲が、上流自身の使う oxc-transform-react の版を含んだとき
    "@vitejs/plugin-react>oxc-transform-react": "^0.147.0"
    # @storybook/addon-vitest@10.6.0 の optional peer は @vitest/browser-playwright ^4 で、Vitest 5 に
    # 追いついていない。撤去条件: storybookjs/storybook#36270 (peer に ^5.0.0 を足す) を含む安定版へ上げたとき
    "@storybook/addon-vitest>@vitest/browser-playwright": "5"
    # storybook@10.6.0 の optional peer (vite-plus ^0.1.15 || ^0.2.0) が 1.0 に追いついていない。読むのは 1.0 も
    # export する vite-plus/versions だけ (storybook@10.6.0 の dist で確認)。撤去条件: storybook の peer が vite-plus 1.x を含んだとき
    # 値が major なので export が消えても鳴らない。上げたときの確認は docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」
    "storybook>vite-plus": "1"

# ===== このテンプレートが追加 (vp migrate が書かない) =====

allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true

# 公開後 3 日 (4320 分) 未満の版を解決しない。.github/dependabot.yml の cooldown と
# .github/zizmor.yml の下限を同じ値に揃える (ADR-0005)
minimumReleaseAge: 4320

# lockfile が解決しなくなった除外を vp add / update / remove が消す (docs/guides/dependencies-and-toolchain.md「待機を前倒しする」)
minimumReleaseAgeExcludePrune: true

# @shadcn/lint が引く @typescript-eslint/parser は、oxlint 経由では読まれないのに eslint を必須 peer に持つ。optional にする (ADR-0023)
# utils には当てない。実行時に eslint を読む (docs/guides/lint/configuration.md「testing-library を story に限る理由」)
# 撤去条件: 上流が parser の eslint を optional peer にしたとき (shadcn-ui/lint#1)
packageExtensions:
  "@typescript-eslint/parser@^8":
    peerDependenciesMeta:
      eslint:
        optional: true

# キーを範囲にする理由は docs/guides/dependencies-and-toolchain.md「patch を当てる」
# addon-vitest@10.6.0 の viewport の import (@vitest/browser/context) は Vitest 5 で失敗し、何も言わずに viewport を当てない。
# import 先を vitest/browser へ替える (storybookjs/storybook#36164)
# 撤去条件: addon-vitest の安定版が peer に vitest 5 を含み、viewport の import を vitest/browser にしたとき
# tanstack-react の patch は、撤去条件の違う 2 つのファイルへの変更を持つ。条件が成り立ったファイルの diff だけを外し、両方外せたら patch とキーを消す
# dist/_browser-chunks/chunk-HRV4LMK3.js への変更: tanstack-react@10.6.0 は router-core 1.171.30 以降の interpolatePath を古い形で呼び、全 story が落ちる (storybookjs/storybook#36330)。
# 引数の数で呼び分け、波括弧の segment は展開しない (docs/guides/storybook.md「自動構成の外を手で置く」)
# 撤去条件: tanstack-react の安定版が storybookjs/storybook#36333 を含んだとき
# dist/preset.js への変更: tanstack-react@10.6.0 は plugin を絞るとき Promise の中を見ない。vite.config.ts の lazyPlugins に渡す関数は async なので、
# TanStack Start の plugin が残って storybook build が落ちる。Promise を解決し、関数が同期のときと同じ並びにしてから絞る (docs/guides/vite-configuration.md「重い依存を遅らせて読み込む」)
# 撤去条件: tanstack-react の安定版が、Promise の plugin を解決してから絞るようになったとき。外したら、mise run verify の vp exec storybook build が通ることで確かめる
patchedDependencies:
  "@storybook/addon-vitest@^10.6.0": patches/@storybook__addon-vitest@10.6.0.patch
  "@storybook/tanstack-react@^10.6.0": patches/@storybook__tanstack-react@10.6.0.patch
