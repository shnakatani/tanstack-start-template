overrides:
  # vite-plus と core (vite の alias) を同じリリースに揃える。版は catalog が持つ。
  # キーを範囲つき (@*) にする。範囲なしだと catalog: 参照まで置き換わり、package.json に解決済みの
  # alias が書き戻る (voidzero-dev/vite-plus#2309)
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true

# 公開後 3 日 (4320 分) 未満の版を解決しない。.github/dependabot.yml の cooldown と
# .github/zizmor.yml の下限を同じ値に揃える (ADR-0005)
minimumReleaseAge: 4320

# lockfile が解決しなくなった除外を vp add / update / remove が自動で消す。
# 下の bare name (vite-plus など) も対象なので、Vite+ がそれを解決しなくなると恒久除外も消える
minimumReleaseAgeExcludePrune: true

# 待機の除外 (ADR-0005)
# - 下の一覧は vp migrate が書く Vite+ 一族の恒久除外。編集しない
# - 足すときは必ず版まで書く (`@scope/pkg@x.y.z`)。版を省くと全版が恒久に除外される
minimumReleaseAgeExclude:
  [
    vite-plus,
    "@voidzero-dev/*",
    oxlint,
    "@oxlint/*",
    oxlint-tsgolint,
    "@oxlint-tsgolint/*",
    oxfmt,
    "@oxfmt/*",
    vitest,
    "@vitest/*",
  ]
# vite-plus と core は同じリリースで揃えて上げる (voidzero-dev/vite-plus#2356)。
# dependabot.yml の vite-plus グループが束ねる
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 5.0.1
  vite-plus: 0.3.3
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11
# @shadcn/lint が依存に持つ @typescript-eslint/parser は、oxlint 経由では読まれないのに eslint を必須 peer に持つ。
# optional にして、parser だけが理由で ESLint 一式が入らないようにする。
# いま ESLint が入るのは、eslint-plugin-testing-library と @tanstack/eslint-plugin-* が @typescript-eslint/utils
# 経由で必須にしているため (`vp why eslint`)。それらが外れれば ESLint も外れる。
# utils 側には当てない。utils は実行時に eslint を読むので、外すと plugin が落ちる (docs/guides/lint/configuration.md)。
# このキーはグラフ全体の parser に効く。ESLint を実際に使う依存を足すときは、その peer が外れていないかを確かめる。
# 撤去条件: 上流が parser の eslint を optional peer にしたとき (shadcn-ui/lint#1)
packageExtensions:
  "@typescript-eslint/parser@^8":
    peerDependenciesMeta:
      eslint:
        optional: true

# vite を core へ alias すると版が 0.x になり、vite の peer 範囲を満たさなくなる。
# vp migrate が書く、番号の不一致だけを抑える設定
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @vitejs/plugin-react の optional peer (oxc-transform-react ^0.145.0) が、上流自身の使う ^0.147.0 を
    # 満たさない (ADR-0014)。plugin-react を上げるたびに両者を読み比べる。
    # 親つきのキーで plugin-react の下だけに効かせ、値は検証した版に絞る (* にすると読み比べの契機が消える)
    "@vitejs/plugin-react>oxc-transform-react": "^0.147.0"
